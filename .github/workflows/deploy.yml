# Keeps the live site in step with main: every push to main runs the full
# test suite against a local copy of the Worker, then deploys it.
#
# Turning deploys on takes two repository secrets (Settings -> Secrets and
# variables -> Actions), added by whoever owns the Cloudflare account:
#   CLOUDFLARE_API_TOKEN   a token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the account the site lives in
# Without them, the tests still run and the deploy step is skipped.
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start a local copy of the Worker
        run: |
          echo 'CREATE_CODE=ci-code' > .dev.vars
          npx wrangler dev --port 8799 > wrangler.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://localhost:8799/ > /dev/null && exit 0; sleep 1; done
          cat wrangler.log; exit 1
      - name: Run the tests
        run: BASE=http://localhost:8799 CODE=ci-code npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy to Cloudflare
        if: env.HAS_TOKEN == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploys are off
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::Tests passed. Deploy skipped - add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy main automatically."
